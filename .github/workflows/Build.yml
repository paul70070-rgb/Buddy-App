{
  "name": "Build Buddy APK",
  "on": [
    "push",
    "workflow_dispatch"
  ],
  "permissions": {
    "contents": "write"
  },
  "jobs": {
    "build": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Checkout repository",
          "uses": "actions/checkout@v4"
        },
        {
          "name": "Prepare Android Gradle Project",
          "run": "set -e\nmkdir -p /tmp/extracted_buddy\nfor z in *.zip; do\n  if [ -f \"$z\" ]; then unzip -oq \"$z\" -d /tmp/extracted_buddy || true; fi\ndone\nmkdir -p app/src/main/assets app/src/main/java/com/buddy/aicompanion app/src/main/res/values\nHTML_FILE=$(find /tmp/extracted_buddy . -name \"*.html\" | head -n 1)\nif [ -n \"$HTML_FILE\" ]; then\n  cp -f \"$HTML_FILE\" app/src/main/assets/index.html\nelse\n  echo \"<!DOCTYPE html><html><body style=\"background:#0D1017;color:#5CE1E6;font-family:sans-serif;text-align:center;padding:40px;\"><h1>Buddy AI Companion</h1></body></html>\" > app/src/main/assets/index.html\nfi\nprintf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\\nrootProject.name = \"BuddyAICompanion\"\\ninclude(\":app\")\\n' > settings.gradle.kts\nprintf 'plugins { id(\"com.android.application\") version \"8.2.2\" apply false; id(\"org.jetbrains.kotlin.android\") version \"1.9.22\" apply false }\\n' > build.gradle.kts\nprintf 'org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\\nandroid.useAndroidX=true\\n' > gradle.properties\nprintf 'plugins { id(\"com.android.application\"); id(\"org.jetbrains.kotlin.android\") }\\nandroid {\\n  namespace = \"com.buddy.aicompanion\"\\n  compileSdk = 34\\n  defaultConfig { applicationId = \"com.buddy.aicompanion\"; minSdk = 24; targetSdk = 34; versionCode = 1; versionName = \"1.0.0\" }\\n  signingConfigs { getByName(\"debug\") { } }\\n  buildTypes { getByName(\"release\") { isMinifyEnabled = false; isShrinkResources = false; signingConfig = signingConfigs.getByName(\"debug\") } }\\n  compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }\\n  kotlinOptions { jvmTarget = \"17\" }\\n}\\ndependencies { implementation(\"androidx.webkit:webkit:1.10.0\") }\\n' > app/build.gradle.kts\nprintf '<?xml version=\"1.0\" encoding=\"utf-8\"?>\\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\\n  <uses-permission android:name=\"android.permission.INTERNET\" />\\n  <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\\n  <uses-permission android:name=\"android.permission.MODIFY_AUDIO_SETTINGS\" />\\n  <uses-permission android:name=\"android.permission.USE_BIOMETRIC\" />\\n  <uses-permission android:name=\"android.permission.VIBRATE\" />\\n  <application android:allowBackup=\"false\" android:label=\"Buddy AI Companion\" android:supportsRtl=\"true\" android:usesCleartextTraffic=\"false\" android:theme=\"@android:style/Theme.DeviceDefault.NoActionBar\">\\n    <activity android:name=\".MainActivity\" android:exported=\"true\" android:configChanges=\"orientation|screenSize|keyboardHidden\">\\n      <intent-filter><action android:name=\"android.intent.action.MAIN\" /><category android:name=\"android.intent.action.LAUNCHER\" /></intent-filter>\\n    </activity>\\n  </application>\\n</manifest>\\n' > app/src/main/AndroidManifest.xml\nprintf 'package com.buddy.aicompanion\\nimport android.annotation.SuppressLint\\nimport android.app.Activity\\nimport android.content.pm.PackageManager\\nimport android.os.Bundle\\nimport android.view.WindowManager\\nimport android.webkit.PermissionRequest\\nimport android.webkit.WebChromeClient\\nimport android.webkit.WebSettings\\nimport android.webkit.WebView\\nimport android.webkit.WebViewClient\\nclass MainActivity : Activity() {\\n  private lateinit var webView: WebView\\n  @SuppressLint(\"SetJavaScriptEnabled\")\\n  override fun onCreate(savedInstanceState: Bundle?) {\\n    super.onCreate(savedInstanceState)\\n    window.setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE)\\n    webView = WebView(this)\\n    setContentView(webView)\\n    webView.settings.apply { javaScriptEnabled = true; domStorageEnabled = true; mediaPlaybackRequiresUserGesture = false; allowFileAccess = true; allowContentAccess = false; cacheMode = WebSettings.LOAD_DEFAULT }\\n    webView.webViewClient = WebViewClient()\\n    webView.webChromeClient = object : WebChromeClient() { override fun onPermissionRequest(request: PermissionRequest?) { request?.grant(request.resources) } }\\n    if (checkSelfPermission(android.Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) { requestPermissions(arrayOf(android.Manifest.permission.RECORD_AUDIO), 101) }\\n    webView.loadUrl(\"file:///android_asset/index.html\")\\n  }\\n  override fun onBackPressed() { if (this::webView.isInitialized && webView.canGoBack()) webView.goBack() else super.onBackPressed() }\\n}\\n' > app/src/main/java/com/buddy/aicompanion/MainActivity.kt\nls -la settings.gradle.kts build.gradle.kts app/build.gradle.kts app/src/main/assets/index.html"
        },
        {
          "name": "Set up JDK 17",
          "uses": "actions/setup-java@v4",
          "with": {
            "java-version": "17",
            "distribution": "temurin"
          }
        },
        {
          "name": "Setup Gradle",
          "uses": "gradle/actions/setup-gradle@v3"
        },
        {
          "name": "Build Signed APK",
          "run": "gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk ./Buddy-AI-Companion.apk"
        },
        {
          "name": "Save APK to Repository Root",
          "run": "git config user.name \"github-actions[bot]\" && git config user.email \"github-actions[bot]@users.noreply.github.com\" && git add Buddy-AI-Companion.apk && (git diff --staged --quiet || git commit -m \"Add compiled Buddy-AI-Companion.apk\") && git push"
        },
        {
          "name": "Upload Installable APK Artifact",
          "uses": "actions/upload-artifact@v4",
          "with": {
            "name": "Buddy-Installable-APK",
            "path": "Buddy-AI-Companion.apk"
          }
        }
      ]
    }
  }
}
