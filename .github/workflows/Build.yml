{
"name": "Build Buddy APK",
"on": ["push", "workflow_dispatch"],
"permissions": {"contents": "write"},
"jobs": {
"build-apk": {
"runs-on": "ubuntu-latest",
"steps": [
{"uses": "actions/checkout@v4"},
{
"name": "Unpack ZIP and prepare Android files",
"run": "mkdir -p /tmp/extracted_buddy && for z in *.zip; do if [ -f \"$z\" ]; then unzip -oq \"$z\" -d /tmp/extracted_buddy; fi; done && (cp -rf /tmp/extracted_buddy/buddy_android_project/* . 2>/dev/null || true) && (cp -rf /tmp/extracted_buddy/* . 2>/dev/null || true) && mkdir -p app/src/main/res/xml && echo '<?xml version=\"1.0\" encoding=\"utf-8\"?><network-security-config><base-config cleartextTrafficPermitted=\"false\"/></network-security-config>' > app/src/main/res/xml/network_security_config.xml && echo '<?xml version=\"1.0\" encoding=\"utf-8\"?><data-extraction-rules><cloud-backup><exclude domain=\"sharedpref\" path=\".\"/></cloud-backup></data-extraction-rules>' > app/src/main/res/xml/data_extraction_rules.xml && if [ ! -f app/buddy-release-key.jks ]; then keytool -genkeypair -v -keystore app/buddy-release-key.jks -alias buddy-key -keyalg RSA -keysize 2048 -validity 10000 -storepass BuddyLove2026 -keypass BuddyLove2026 -dname 'CN=Buddy AI, OU=Mobile, O=BuddyAI, L=Chennai, ST=TN, C=IN'; fi && if grep -q AppCompatActivity app/src/main/java/com/buddy/aicompanion/MainActivity.kt 2>/dev/null; then sed -i 's/@android:style\\/Theme.DeviceDefault.NoActionBar/@style\\/Theme.AppCompat.NoActionBar/g' app/src/main/AndroidManifest.xml || true; fi"
},
{
"uses": "actions/setup-java@v4",
"with": {"java-version": "17", "distribution": "temurin"}
},
{
"uses": "gradle/actions/setup-gradle@v3",
"with": {"gradle-version": "8.5"}
},
{
"name": "Build Signed APK",
"run": "gradle assembleRelease --no-daemon"
},
{
"name": "Save Buddy-AI-Companion.apk to main repo page",
"run": "cp app/build/outputs/apk/release/app-release.apk ./Buddy-AI-Companion.apk && git config user.name 'github-actions[bot]' && git config user.email 'github-actions[bot]@users.noreply.github.com' && git add Buddy-AI-Companion.apk && (git commit -m 'Add installable Buddy-AI-Companion.apk [skip ci]' || true) && (git push || true)"
},
{
"uses": "actions/upload-artifact@v4",
"with": {"name": "Buddy-Installable-APK", "path": "app/build/outputs/apk/release/app-release.apk"}
}
]
}
}
}
