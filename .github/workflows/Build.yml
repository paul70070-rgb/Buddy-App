name: Build Buddy APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      # The previous failure: the runner's default Gradle (9.8.1) is too new for
      # Android Gradle Plugin 8.2.2. Pin a compatible Gradle version instead.
      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"

      - name: Locate and prepare project
        run: |
          set -euo pipefail
          mkdir -p /tmp/extracted
          for z in *.zip; do
            [ -f "$z" ] && unzip -oq "$z" -d /tmp/extracted || true
          done

          SETTINGS=$(find /tmp/extracted -name settings.gradle.kts 2>/dev/null | head -n 1 || true)
          if [ -n "$SETTINGS" ]; then
            PROJ=$(dirname "$SETTINGS")
          elif [ -f settings.gradle.kts ]; then
            PROJ="$GITHUB_WORKSPACE"
          else
            echo "ERROR: no Android project found (no zip with settings.gradle.kts, none at repo root)"
            exit 1
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project directory: $PROJ"
          cd "$PROJ"

          # --- Fill in files the project is missing ---
          mkdir -p app/src/main/res/xml app/src/main/res/values

          [ -f app/src/main/res/xml/data_extraction_rules.xml ] || cat > app/src/main/res/xml/data_extraction_rules.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="database" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="database" path="." />
              </device-transfer>
          </data-extraction-rules>
          EOF

          [ -f app/src/main/res/xml/network_security_config.xml ] || cat > app/src/main/res/xml/network_security_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          EOF

          # MainActivity extends AppCompatActivity, which crashes at launch
          # unless the app uses an AppCompat theme.
          cat > app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.Buddy" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:windowBackground">#07080C</item>
              </style>
          </resources>
          EOF

          MANIFEST=app/src/main/AndroidManifest.xml
          sed -i 's|android:theme="@android:style/Theme.DeviceDefault.NoActionBar"|android:icon="@mipmap/ic_launcher" android:theme="@style/Theme.Buddy"|' "$MANIFEST"
          # Fix a wrong launcher category if present (it would hide the app icon)
          sed -i 's|android.intent.action.LAUNCHER|android.intent.category.LAUNCHER|' "$MANIFEST"

          # Keep the WebView JavaScript bridge from being stripped by R8
          cat > app/proguard-rules.pro <<'EOF'
          -keepattributes JavascriptInterface
          -keepclassmembers class com.buddy.aicompanion.MainActivity$AndroidBiometricBridge {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class com.buddy.aicompanion.MainActivity { public void promptNativeBiometric(); }
          EOF

          # Release keystore (generated here because it is not in the zip)
          if [ ! -f app/buddy-release-key.jks ]; then
            keytool -genkeypair -v \
              -keystore app/buddy-release-key.jks \
              -alias buddy-key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass BuddyLove2026 -keypass BuddyLove2026 \
              -dname "CN=Buddy AI, O=Buddy, C=IN"
          fi

          echo "--- manifest ---"
          cat "$MANIFEST"

      - name: Build signed release APK
        run: |
          set -euo pipefail
          cd "$PROJ"
          gradle --version
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Buddy-AI-Companion.apk"
          ls -la "$GITHUB_WORKSPACE/Buddy-AI-Companion.apk"

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Installable-APK
          path: Buddy-AI-Companion.apk

      - name: Save APK to repository root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Buddy-AI-Companion.apk
          git diff --staged --quiet || git commit -m "Add compiled Buddy-AI-Companion.apk"
          git push
